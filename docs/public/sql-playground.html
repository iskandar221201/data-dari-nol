<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Playground: Data dari Nol</title>
<style>
  :root {
    --navy: #1e3a5f;
    --amber: #d97706;
    --bg: #fafaf7;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-2: #64748b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
    max-width: 1000px;
    margin-inline: auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.3rem; color: var(--navy); }
  .sub { color: var(--text-2); margin: 0 0 1.2rem; font-size: 0.95rem; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    margin-bottom: 1rem;
  }
  .panel h2 { font-size: 1rem; margin: 0 0 0.8rem; color: var(--navy); }
  textarea {
    width: 100%;
    min-height: 120px;
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
  }
  textarea:focus-visible, button:focus-visible, select:focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 2px;
  }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; align-items: center; }
  button {
    font-size: 0.95rem;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    min-height: 44px;
  }
  button.primary {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
    font-weight: 600;
  }
  button.sample {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.45rem 0.8rem;
    min-height: 44px;
  }
  select {
    font-size: 0.95rem;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    min-height: 44px;
    max-width: 100%;
  }
  .ds-label { font-weight: 600; color: var(--navy); margin-right: 0.4rem; }
  .status { font-size: 0.9rem; color: var(--text-2); margin-top: 0.6rem; min-height: 1.4em; }
  .status.loading { color: var(--amber); }
  .status.error { color: #b91c1c; }
  .status.ok { color: #15803d; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    margin-top: 0.5rem;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.7rem;
    text-align: left;
  }
  th { background: #f1f5f9; color: var(--navy); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .schema { display: flex; gap: 1rem; flex-wrap: wrap; }
  .schema table { width: auto; min-width: 280px; }
  .empty-note { color: var(--text-2); font-size: 0.9rem; }
  kbd {
    font-family: var(--mono);
    background: #f1f5f9;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
    font-size: 0.85em;
  }
</style>
</head>
<body>

<h1 id="pg-title">SQL Playground</h1>
<p class="sub" id="pg-desc">Database contoh berjalan sepenuhnya di browser. Tulis query, tekan <kbd>Ctrl</kbd>+<kbd>Enter</kbd> atau tombol Jalankan.</p>

<div class="panel">
  <span class="ds-label"><label for="ds">Dataset:</label></span>
  <select id="ds" aria-label="Pilih dataset"></select>
</div>

<div class="panel" id="status-panel">
  <div class="status loading" id="status" role="status">Memuat database...</div>
</div>

<div class="panel">
  <h2>Skema data</h2>
  <div class="schema" id="schema"></div>
</div>

<div class="panel">
  <h2>Tulis query</h2>
  <label for="q" class="empty-note">Query SQL (SELECT saja untuk latihan ini)</label>
  <textarea id="q" spellcheck="false"></textarea>
  <div class="row">
    <button class="primary" id="run" disabled>Jalankan query</button>
    <span class="row" id="samples" style="margin-top:0"></span>
  </div>
</div>

<div class="panel">
  <h2>Hasil</h2>
  <div id="result"><p class="empty-note">Belum ada query yang dijalankan.</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var runBtn = document.getElementById('run');
  var qEl = document.getElementById('q');
  var resultEl = document.getElementById('result');
  var schemaEl = document.getElementById('schema');
  var samplesEl = document.getElementById('samples');
  var dsSelect = document.getElementById('ds');
  var titleEl = document.getElementById('pg-title');
  var descEl = document.getElementById('pg-desc');
  var db = null;

  var params = new URLSearchParams(location.search);
  var dsId = params.get('ds') || 'karyawan';

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + cls;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function fitFrame() {
    try {
      if (window.frameElement) {
        window.frameElement.style.height = Math.max(640, document.body.scrollHeight + 24) + 'px';
      }
    } catch (e) { /* abaikan kalau beda origin */ }
  }

  function render(res) {
    if (!res.length || !res[0].values.length) {
      resultEl.innerHTML = '<p class="empty-note">Query berhasil, tapi tidak ada baris yang cocok.</p>';
    } else {
      var html = '<table><tr>';
      res[0].columns.forEach(function (c) { html += '<th>' + esc(c) + '</th>'; });
      html += '</tr>';
      res[0].values.forEach(function (row) {
        html += '<tr>';
        row.forEach(function (v) {
          var num = typeof v === 'number' ? ' class="num"' : '';
          html += '<td' + num + '>' + esc(v === null ? 'NULL' : v) + '</td>';
        });
        html += '</tr>';
      });
      html += '</table><p class="empty-note">' + res[0].values.length + ' baris.</p>';
      resultEl.innerHTML = html;
    }
    fitFrame();
  }

  function jalankan() {
    if (!db) return;
    var q = qEl.value.trim();
    if (!q) {
      setStatus('Tulis dulu query-nya.', 'error');
      return;
    }
    try {
      var res = db.exec(q);
      render(res);
      setStatus('Query berhasil dijalankan.', 'ok');
    } catch (e) {
      resultEl.innerHTML = '<p class="empty-note">Tidak ada hasil karena query gagal.</p>';
      setStatus('Error: ' + e.message, 'error');
      fitFrame();
    }
  }

  function sqlVal(v, type) {
    if (v === null || v === undefined) return 'NULL';
    if (type === 'TEXT') return "'" + String(v).replace(/'/g, "''") + "'";
    return v;
  }

  function muatDataset(SQL, data) {
    if (db) db.close();
    db = new SQL.Database();
    data.tables.forEach(function (t) {
      var cols = t.columns.map(function (c) { return '"' + c.name + '" ' + c.type; }).join(', ');
      db.run('CREATE TABLE "' + t.name + '" (' + cols + ');');
      t.rows.forEach(function (r) {
        var vals = r.map(function (v, i) { return sqlVal(v, t.columns[i].type); }).join(', ');
        db.run('INSERT INTO "' + t.name + '" VALUES (' + vals + ');');
      });
    });

    titleEl.textContent = 'SQL Playground: ' + data.title;
    descEl.textContent = data.description + ' Tulis query, tekan Ctrl+Enter atau tombol Jalankan.';

    var sh = '';
    data.tables.forEach(function (t) {
      sh += '<table aria-label="Skema tabel ' + esc(t.name) + '"><tr><th colspan="2">' + esc(t.name) + '</th></tr>';
      t.columns.forEach(function (c) {
        sh += '<tr><td>' + esc(c.name) + '</td><td class="num">' + esc(c.type) + '</td></tr>';
      });
      sh += '</table>';
    });
    schemaEl.innerHTML = sh;

    samplesEl.innerHTML = '';
    (data.samples || []).forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'sample';
      b.textContent = s.label;
      b.setAttribute('data-q', s.sql);
      b.addEventListener('click', function () {
        qEl.value = s.sql;
        qEl.focus();
      });
      samplesEl.appendChild(b);
    });

    qEl.value = data.defaultQuery || ('SELECT * FROM "' + data.tables[0].name + '" LIMIT 10;');
    setStatus('Database siap (' + data.subtitle + '). Silakan tulis query.', 'ok');
    runBtn.disabled = false;
    fitFrame();
  }

  runBtn.addEventListener('click', jalankan);
  qEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') jalankan();
  });
  dsSelect.addEventListener('change', function () {
    var u = new URL(location.href);
    u.searchParams.set('ds', dsSelect.value);
    location.href = u.toString();
  });

  setStatus('Memuat daftar dataset...', 'loading');
  fetch('datasets/index.json')
    .then(function (r) { if (!r.ok) throw new Error('index'); return r.json(); })
    .then(function (list) {
      var ok = false;
      list.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d.id;
        o.textContent = d.title + ' — ' + d.blurb;
        if (d.id === dsId) { o.selected = true; ok = true; }
        dsSelect.appendChild(o);
      });
      if (!ok && list.length) dsId = list[0].id;
      setStatus('Memuat database...', 'loading');
      return initSqlJs({ locateFile: function (f) {
        return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f;
      }});
    })
    .then(function (SQL) {
      return fetch('datasets/' + encodeURIComponent(dsId) + '.json')
        .then(function (r) { if (!r.ok) throw new Error('dataset'); return r.json(); })
        .then(function (data) { muatDataset(SQL, data); });
    })
    .catch(function () {
      setStatus('Gagal memuat database. Periksa koneksi internet lalu muat ulang halaman.', 'error');
    });

  window.addEventListener('load', fitFrame);
})();
</script>
</body>
</html>
